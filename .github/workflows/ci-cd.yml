name: Portfolio CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub,aud,repository,repository_id,repository_owner,repository_owner_id}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::964641148776:role/GitHubActions-S3-Deploy
          aws-region: ap-south-1

      - name: Build Docker image
        run: docker build -t portfolio-devops .

      - name: Check Docker image
        run: docker images portfolio-devops

      - name: Deploy website to S3
        run: aws s3 sync . s3://portfolio-devops-sakthi-2026 --exclude ".git/*" --exclude ".github/*" --delete